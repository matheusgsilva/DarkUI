name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: ''

      - name: Install Android SDK 36
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build icon-pack template
        run: gradle :iconpacktemplate:assembleRelease --stacktrace

      - name: Verify 1024 unique icon slots
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import re
          import zipfile

          apk = "iconpacktemplate/build/outputs/apk/release/iconpacktemplate-release-unsigned.apk"
          slot = re.compile(r"^res/.*/icon_\d{4}\.png$")

          with zipfile.ZipFile(apk) as z:
              all_names = z.namelist()
              candidates = sorted(name for name in all_names if "icon_" in name)
              names = sorted(name for name in all_names if slot.search(name))

              print(f"ZIP entries: {len(all_names)}")
              print(f"Entries containing icon_: {len(candidates)}")
              print("First icon candidates:", candidates[:20])
              print("First res entries:", [n for n in all_names if n.startswith("res/")][:30])

              assert len(names) == 1024, (
                  f"expected 1024 slot files, found {len(names)}; "
                  f"icon candidates={len(candidates)}"
              )

              digests = {hashlib.sha256(z.read(name)).digest() for name in names}
              assert len(digests) == 1024, (
                  f"AAPT deduplicated icon slots: only {len(digests)} unique payloads"
              )

          print("Template OK: 1024 distinct PNG resource slots")
          PY

      - name: Dump template resource table
        if: failure()
        shell: bash
        run: |
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          APK="iconpacktemplate/build/outputs/apk/release/iconpacktemplate-release-unsigned.apk"
          "$AAPT2" dump resources "$APK" | grep -m 40 -E "icon_[0-9]{4}|drawable" || true

      - name: Build debug and release APKs
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Verify embedded template integrity
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import zipfile

          app_apk = "app/build/outputs/apk/debug/app-debug.apk"
          template_apk = "iconpacktemplate/build/outputs/apk/release/iconpacktemplate-release-unsigned.apk"

          with open(template_apk, "rb") as f:
              expected = f.read()

          with zipfile.ZipFile(app_apk) as z:
              names = set(z.namelist())
              assert "assets/darkui-template.apk" in names, "template asset missing from app APK"
              embedded = z.read("assets/darkui-template.apk")

          assert embedded == expected, (
              "embedded template differs from the validated template: "
              f"{hashlib.sha256(embedded).hexdigest()} != "
              f"{hashlib.sha256(expected).hexdigest()}"
          )
          print("Main APK contains the exact validated darkui-template.apk")
          PY

      - name: Run dark-icon unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DarkUI-build-and-reports
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
